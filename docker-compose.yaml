version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    volumes:
      - cupa-data:/app/data
    restart: unless-stopped

volumes:
  cupa-data:
